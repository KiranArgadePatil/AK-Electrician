name: Fix screw unit correctly
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct screw units
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('material-form.html')
          s=p.read_text(encoding='utf-8')
          old="if(screwNames.has(name))return '<option value=\"नग\">नग</option><option value=\"बॉक्स\">बॉक्स</option>';"
          new="if(name==='स्क्रू')return '<option value=\"नग\">नग</option><option value=\"बॉक्स\">बॉक्स</option>';if(name==='काळे स्क्रू')return '<option value=\"नग\">नग</option>';"
          if old not in s:
              raise SystemExit('current screw unit pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add material-form.html
          git commit -m 'Only plain screws get box unit' || true
          git push
          git rm .github/workflows/fix-screw-unit-2.yml || true
          git commit -m 'Remove temporary screw workflow' || true
          git push || true
