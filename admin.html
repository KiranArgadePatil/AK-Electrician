<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | AK इलेक्ट्रिशियन</title><style>body{font-family:system-ui,'Noto Sans Devanagari',sans-serif;background:#f4f6f8;margin:0;color:#102033}.top{background:#071525;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.brand b,.brand small{display:block}.brand small{color:#b5c2cf}.nav{display:flex;gap:8px}.nav a{color:#071525;background:#ffc400;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:900}.box{max-width:650px;margin:25px auto;padding:20px;background:#fff;border-radius:18px;box-shadow:0 10px 35px #0001}h1{margin-top:0}.field{margin:10px 0}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd4dc;border-radius:9px;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;background:#071525;color:#ffc400;margin-top:8px}.danger{background:#c62828;color:#fff}.hide{display:none}.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:8px}.note{background:#fff8d9;padding:10px;border-radius:9px;font-size:13px;margin:12px 0}.success{background:#e8f7ef;border:1px solid #9bd8b7;padding:10px;border-radius:9px;margin:12px 0}small{color:#718092}@media(max-width:700px){.box{margin:15px 10px}.top{padding:12px 10px}.nav a{padding:8px;font-size:12px}}</style></head><body><header class="top"><div><b>AK Patil उद्योगसमूह</b><small>AK इलेक्ट्रिशियन • Admin</small></div><nav class="nav"><a href="material-form.html">📦 मटेरियल</a><a href="index.html">⌂ Home</a></nav></header><main class="box"><div id="login"><h1>🔐 Admin Login</h1><div class="field"><input id="user" placeholder="Username"></div><div class="field"><input id="pass" type="password" placeholder="Password"></div><button class="btn" onclick="login()">🔓 Login</button><div class="note">Admin Login केल्यानंतर नवीन मटेरियल Add करता येईल.</div></div><div id="panel" class="hide"><h1>⚙️ Admin Panel</h1><div class="success">✅ Login झाले. आता नवीन मटेरियल Add करा.</div><div class="field"><input id="name" placeholder="नवीन मटेरियलचे नाव"></div><div class="field"><input id="size" placeholder="Size / साईज (उदा. 25 mm)"></div><div class="field"><select id="unit"><option>नग</option><option>पॅकेट</option><option>मीटर</option><option>फूट</option><option>बंडल</option><option>सेट</option></select></div><button class="btn" onclick="addMaterial()">➕ मटेरियल Add करा</button><button class="btn danger" onclick="logout()">Logout</button><h2>📋 Add केलेले मटेरियल</h2><div id="list"></div></div></main><script>const U='admin',P='AK7775';function login(){if(document.getElementById('user').value===U&&document.getElementById('pass').value===P){sessionStorage.akAdmin='1';show()}else alert('Username किंवा Password चुकीचा आहे.')}function show(){document.getElementById('login').classList.add('hide');document.getElementById('panel').classList.remove('hide');render()}function logout(){sessionStorage.removeItem('akAdmin');location.reload()}function addMaterial(){let n=document.getElementById('name').value.trim(),s=document.getElementById('size').value.trim(),u=document.getElementById('unit').value;if(!n)return alert('मटेरियलचे नाव भरा');let a=JSON.parse(localStorage.getItem('akCustomMaterials')||'[]');a.push({name:n,size:s||'—',unit:u});localStorage.setItem('akCustomMaterials',JSON.stringify(a));document.getElementById('name').value='';document.getElementById('size').value='';render();alert('मटेरियल Add झाले')}function render(){let a=JSON.parse(localStorage.getItem('akCustomMaterials')||'[]');document.getElementById('list').innerHTML=a.length?a.map((x,i)=>`<div class="item"><span><b>${x.name}</b><br><small>${x.size} • ${x.unit}</small></span><button class="btn danger" onclick="del(${i})">Delete</button></div>`).join(''):'<p>अजून नवीन मटेरियल नाही.</p>'}function del(i){let a=JSON.parse(localStorage.getItem('akCustomMaterials')||'[]');a.splice(i,1);localStorage.setItem('akCustomMaterials',JSON.stringify(a));render()}if(sessionStorage.akAdmin==='1')show();</script></body></html>
